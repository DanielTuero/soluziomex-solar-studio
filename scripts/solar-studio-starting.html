<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Starting Solar Studio…</title>
  <style>
    :root { color-scheme: light; font-family: "Segoe UI", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6f3; color: #17231e; }
    main { width: min(430px, calc(100vw - 36px)); padding: 42px; text-align: center; border: 1px solid #e2e8e4; border-radius: 22px; background: white; box-shadow: 0 20px 60px rgba(20,61,45,.10); }
    .mark { width: 68px; height: 68px; margin: 0 auto 24px; position: relative; display: grid; place-items: center; border-radius: 18px; background: #003f3c; }
    .sun { width: 25px; height: 25px; border-radius: 50%; background: #fcb400; box-shadow: 0 -20px 0 -9px #fcb400, 0 20px 0 -9px #fcb400, 20px 0 0 -9px #fcb400, -20px 0 0 -9px #fcb400; }
    h1 { margin: 0; font-size: 24px; letter-spacing: -.04em; }
    p { margin: 9px 0 24px; color: #66736d; font-size: 13px; }
    .track { height: 5px; overflow: hidden; border-radius: 99px; background: #e5ece8; }
    .track span { display: block; width: 36%; height: 100%; border-radius: inherit; background: #1f6045; animation: move 1.15s ease-in-out infinite alternate; }
    small { display: block; margin-top: 16px; color: #8a9690; font-size: 10px; }
    @keyframes move { from { transform: translateX(-20%); } to { transform: translateX(195%); } }
  </style>
</head>
<body>
  <main>
    <div class="mark"><div class="sun"></div></div>
    <h1>Starting Solar Studio</h1>
    <p>Loading your local project database and economics workspace.</p>
    <div class="track"><span></span></div>
    <small>This page will open the dashboard automatically.</small>
  </main>
  <script>
    const appUrl = "http://localhost:3100";
    async function openWhenReady() {
      try {
        await fetch(`${appUrl}/api/security/status?launch=${Date.now()}`, { mode: "no-cors", cache: "no-store" });
        window.location.replace(`${appUrl}/api/security/launch`);
      } catch {
        window.setTimeout(openWhenReady, 700);
      }
    }
    openWhenReady();
  </script>
</body>
</html>
